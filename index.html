<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Field</title>
<meta name="description" content="Open Field: organize and find pickup soccer near you.">
<style>
  :root { --bg: #F3F6FA; --card: #FFFFFF; --text: #0E1A2B; --muted: #4A5A70; --line: #D9E1EB; --accent: #1E7A57; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1524; --card: #14223A; --text: #E8EEF6; --muted: #9DACC2; --line: #24344F; --accent: #A8E6CF; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .brand { font-weight: 800; font-style: italic; letter-spacing: .02em; text-transform: uppercase; color: var(--accent); text-decoration: none; font-size: 15px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 12px 0 4px; }
  h2 { font-size: 22px; margin: 40px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  h3 { font-size: 18px; margin: 24px 0 4px; }
  p, li { color: var(--text); }
  .muted { color: var(--muted); }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .table-wrap { overflow-x: auto; }
  nav.toc { background: var(--card); border-radius: 12px; padding: 12px 16px; margin: 24px 0; }
  nav.toc ol { margin: 0; padding-left: 20px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
<h1>Open Field</h1>
<p class="muted">Organize and find pickup soccer near you.</p>
<ul>
  <li><a href="privacy.html">Privacy Policy</a></li>
  <li><a href="terms.html">Terms of Service</a></li>
</ul>
<h2>Support</h2>
<p>Questions, problems, safety concerns or data requests: <a href="mailto:decosdevlab@gmail.com">decosdevlab@gmail.com</a>.</p>
<p>To delete your account, open the app and go to Profile → Delete Account.</p>
</main>
</body>
</html>
